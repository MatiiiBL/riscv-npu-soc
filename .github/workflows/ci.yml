# Continuous integration for Pulse (see docs/verification.md).
#
# Each job checks out the repository, installs only what it needs through
# .github/actions/setup, and runs the same make targets as a local checkout.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iss:
    name: ISS (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          firmware: true
      - name: Build the ISS (-Werror)
        run: |
          "$CXX" --version | head -n 1
          make -j"$(nproc)" iss
      - name: ISS unit tests
        run: make test-iss
      - name: riscv-tests on the ISS
        run: make -j"$(nproc)" test-isa-iss
      - name: riscv-tests refuse to run without the submodule
        run: |
          if make -C verif/riscv-tests list SUITE_DIR="$RUNNER_TEMP/no-submodule" > "$RUNNER_TEMP/rt.log" 2>&1; then
            echo "::error::verif/riscv-tests ran without its test sources"; exit 1
          fi
          grep "git submodule update" "$RUNNER_TEMP/rt.log"
      # Includes the NPU tests with other array sizes (sw/Makefile NPU_ARRS).
      - name: Firmware tests on the ISS
        run: make -j"$(nproc)" -C sw test SIMS=build/iss/iss
      - name: Random difftest, ISS against itself
        run: make -C verif/random -j"$(nproc)" SEEDS=100 LEN=2000 RTL_SIM=build/iss/iss
      - name: difftest self-test
        run: make -C verif/random selftest
      - name: Keep failing cases
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iss-${{ matrix.cxx }}-failures
          path: |
            build/random/fail/
            build/riscv-tests/*.log
            build/sw/*.out
          if-no-files-found: ignore

  npu:
    name: NPU (lint, cocotb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          hdl: true
          python: true
      - name: Verilator lint of every RTL top
        run: make lint
      - name: cocotb tests of npu_top
        run: make test-npu
      - name: Keep test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npu-results
          path: build/npu/**/results.xml
          if-no-files-found: ignore

  # Tests against the Verilator SoC model (sim/), in its default build
  # (BP_MODE=1, 16-byte NPU DMA port) and in the variants whose behavior must
  # not differ. A new test is one matrix entry: a name and its commands.
  rtl:
    name: RTL (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: riscv-tests
            run: make -j"$(nproc)" test-isa-rtl
          - name: riscv-tests, BP_MODE=0
            run: |
              make -j"$(nproc)" -C sim BP_MODE=0
              make -j"$(nproc)" -C verif/riscv-tests run-rtl RTL_SIM="$PWD/build/sim/soc_sim_bp0"
          - name: directed core tests
            run: make -j"$(nproc)" test-core
          - name: predictor builds compared
            run: make -j"$(nproc)" -C verif/core bp-compare
          - name: random initial state
            run: make -j"$(nproc)" -C verif/core randreset
          - name: serial UART
            run: make -j"$(nproc)" -C verif/core uart-serial
          - name: firmware
            run: make -j"$(nproc)" test-sw
          - name: firmware, NPU_DMA_BYTES=4
            run: |
              make -j"$(nproc)" -C sim NPU_DMA_BYTES=4
              make -j"$(nproc)" -C sw test SIMS=build/sim/soc_sim_dma4
          - name: random difftest
            run: make -j"$(nproc)" test-random
          - name: random difftest, BP_MODE=0
            run: |
              make -j"$(nproc)" iss
              make -j"$(nproc)" -C sim BP_MODE=0
              make -j"$(nproc)" -C verif/random RTL_SIM=build/sim/soc_sim_bp0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          firmware: true
          hdl: true
      - name: Test
        run: ${{ matrix.run }}
      - name: Keep failing cases
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rtl-${{ strategy.job-index }}-failures
          path: |
            build/random/fail/
            build/riscv-tests/*.log
            build/verif/core/
            build/sw/*.out
          if-no-files-found: ignore

  # Synthesis of the NPU and the SoC on their own, then the full ULX3S flow:
  # place and route of the board top with the hello firmware in block RAM,
  # timing against the board clock, and the bitstream.
  synth:
    name: Synthesis (Yosys, ECP5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The SoC and the board are synthesized with the hello firmware as
      # their memory image, so the job needs the firmware toolchain too. The
      # OSS CAD Suite (hdl) brings nextpnr-ecp5 and ecppack along with Yosys.
      - uses: ./.github/actions/setup
        with:
          hdl: true
          firmware: true
      - name: npu_top
        run: python3 .github/scripts/synth_report.py --top npu_top --filelist rtl/npu/npu.f
      - name: soc_top
        run: |
          make -C rtl synth-check
          python3 .github/scripts/synth_report.py --top soc_top --stat build/synth-check/stat.txt
      - name: Lint the ULX3S board top
        run: make -C fpga lint
      - name: ULX3S bitstream (hello)
        run: |
          nextpnr-ecp5 --version
          make -C fpga FW=hello
      - name: ULX3S utilization and timing
        run: make -C fpga report
      - name: Keep the bitstream
        uses: actions/upload-artifact@v7
        with:
          name: ulx3s-hello
          path: |
            build/fpga/pulse_hello.bit
            build/fpga/hello/report.json
            build/fpga/hello/nextpnr.log
          if-no-files-found: error
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ulx3s-logs
          path: |
            build/fpga/hello/*.log
            build/fpga/hello/report.json
          if-no-files-found: ignore
